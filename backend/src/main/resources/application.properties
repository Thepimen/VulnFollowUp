# =============================================================================
# VulnFollowUp Backend - Configuración de Persistencia (Spring Boot 3 / Java 21)
# =============================================================================
spring.application.name=vulnfollowup-backend
server.port=8080

# -----------------------------------------------------------------------------
# 1. CONEXIÓN A BASE DE DATOS (PostgreSQL 15+, esquema oficial database/schema/01_schema.sql)
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vulnfollowup}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# 2. HIBERNATE / JPA - VALIDACIÓN ESTRICTA SIN MODIFICAR EL ESQUEMA SQL
# -----------------------------------------------------------------------------
# validate: comprueba que las entidades coincidan con las tablas SQL existentes
# sin ejecutar nunca CREATE, ALTER ni DROP sobre la base de datos.
spring.jpa.hibernate.ddl-auto=validate

# Respeta los nombres exactos definidos en @Table y @Column (incluyendo mayúsculas en "IT_Provider", etc.)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Desactiva Open-In-View para obligar a cargar relaciones LAZY dentro de transacciones (Clean Architecture)
spring.jpa.open-in-view=false

# Logs de consultas SQL (útil en desarrollo durante 2.º DAM)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
