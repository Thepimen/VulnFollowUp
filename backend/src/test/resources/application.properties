# =============================================================================
# Configuración de pruebas (H2 en modo compatibilidad PostgreSQL)
# Permite ejecutar JUnit 5 (login BCrypt, CRUD y demostración de Rollback JSON)
# sin necesitar un servidor externo levantado durante 'mvn test'.
# =============================================================================
spring.datasource.url=jdbc:h2:mem:vulnfollowup_test;MODE=PostgreSQL;DATABASE_TO_LOWER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
