# =============================================================================
# Configuración de pruebas (PostgreSQL en contenedor con Testcontainers)
# La conexión (URL, usuario y contraseña) no se fija aquí: la consulta en tiempo
# de ejecución AbstractPostgresIntegrationTest mediante @DynamicPropertySource.
# El esquema y el seed los carga el propio soporte de pruebas desde los scripts
# oficiales de database/; Hibernate solo valida el mapeo contra ese esquema.
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
